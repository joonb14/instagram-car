<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카메라·전환 프리비즈</title>
<style>body{background:#10171e;color:#eee;font:15px/1.6 system-ui;margin:24px}select,button{padding:10px;background:#263746;color:white;border:1px solid #56636f;border-radius:6px;cursor:pointer}main{display:grid;grid-template-columns:minmax(280px,44%) 1fr;gap:24px;margin-top:20px}video{width:100%;height:78vh;background:#080c10}a{color:#f1c586}#timeline{display:flex;flex-wrap:wrap;gap:6px}.active{outline:2px solid #edc782}textarea{width:100%;height:150px;box-sizing:border-box;background:#17232e;color:white;padding:12px}p{color:#bacad6}@media(max-width:750px){main{grid-template-columns:1fr}video{height:55vh}}</style>
<h1>기존 구도 + 카메라 기법 + 컷별 전환</h1><p>8개 × 20초 · 1080×1920 · 60fps · 차량/휠/실내 고정. 생성에는 클린 버전을 사용하고 전환은 편집 단계에 적용하세요.</p>
<select id="preset" aria-label="프리셋"></select> <select id="edition" aria-label="영상 버전"><option value="video">전환 시안</option><option value="clean">생성용 클린</option></select> <label><input type="checkbox" id="continuous" checked>다음 조합 자동재생</label>
<main><video id="video" controls playsinline></video><section><h2 id="title"></h2><div id="timeline"></div><h3 id="shot"></h3><p id="transition"></p><textarea id="shotprompt" readonly aria-label="현재 컷 프롬프트"></textarea><p id="shotfiles"></p><p id="links"></p><details><summary>전체 프롬프트·레시피</summary><p id="files"></p></details><p>시작 PNG는 범용 프록시입니다. 실제 차량/실내 사진은 별도로 연결해야 합니다.</p></section></main>
<script>
const data=__DATA__;
const v=document.getElementById('video'),select=document.getElementById('preset'),edition=document.getElementById('edition');edition.value=data.preferred_edition||'video';
data.presets.forEach((p,i)=>select.add(new Option(p.id+' · '+p.title,i)));
function current(){return data.presets[+select.value]}
function update(){const p=current(),i=Math.min(9,Math.floor(v.currentTime/2)),s=p.shots[i];document.getElementById('shot').textContent=`${s.start}–${s.end}초 · ${s.id} ${s.title}`;document.getElementById('transition').textContent='다음 컷 전환: '+s.transition_after;document.getElementById('shotprompt').value=s.camera_prompt;document.getElementById('shotfiles').innerHTML=`<a href="shots/${s.id}/preview.mp4">이 컷 MP4</a> · <a href="shots/${s.id}/start.png">시작 PNG</a>`;document.querySelectorAll('#timeline button').forEach((b,n)=>b.classList.toggle('active',n===i))}
function load(autoplay=false){const p=current();v.src=p[edition.value];document.getElementById('title').textContent=p.title;const t=document.getElementById('timeline');t.replaceChildren();p.shots.forEach(s=>{const b=document.createElement('button');b.textContent=s.start+'s '+s.id;b.onclick=()=>{v.currentTime=s.start;v.play().catch(()=>{})};t.append(b)});document.getElementById('links').innerHTML=`<a href="${p.video}">전환 시안 MP4</a> · <a href="${p.clean}">생성용 클린 MP4</a>`;document.getElementById('files').innerHTML=`<a href="${p.prompt}">전체 프롬프트 TXT</a> · <a href="${p.category}/${p.id}/recipe.json">전환 레시피 JSON</a>`;update();if(autoplay)v.play().catch(()=>{})}
select.onchange=()=>load(true);edition.onchange=()=>load(true);v.ontimeupdate=update;v.onended=()=>{if(document.getElementById('continuous').checked&&+select.value<data.presets.length-1){select.value=+select.value+1;load(true)}};load();
</script></html>
